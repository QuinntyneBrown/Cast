name: Publish

on:
  push:
    branches:
      - main

# Deny-by-default at the workflow level. The publish job raises only what it needs.
permissions:
  contents: read

# Serialize publishes on main. Do NOT cancel in-progress runs: cancelling mid-publish
# could push a .nupkg but skip the tag (or vice versa), leaving an inconsistent release.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Extra guard: only ever run for the real main branch, never a fork/tag/PR ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write   # only to push the git tag via the built-in GITHUB_TOKEN

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # required for an accurate commit count

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: version
        run: |
          # Patch = number of first-parent commits on main, so each commit to main bumps it
          # by exactly one (stable across squash/merge PRs). The .NET SDK appends +<sha> to the
          # informational version, so `cast --version` stays traceable to the exact commit.
          # Minor line 1.1: named templates (CRUD + render) and Notepad auto-open.
          PATCH=$(git rev-list --count --first-parent HEAD)
          VERSION="1.1.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore Cast.sln

      # Thread the computed version through BUILD so the shipped assembly is stamped with it
      # (not the csproj's local 1.0.0 default), then PACK reuses those exact outputs (--no-build).
      - name: Build (Release)
        run: >-
          dotnet build Cast.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test (Release)
        run: dotnet test Cast.sln --configuration Release --no-build --verbosity normal

      - name: Pack CLI as a .NET tool
        run: >-
          dotnet pack src/Cast.Cli/Cast.Cli.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkg

      - name: Push to NuGet
        run: >-
          dotnet nuget push "./nupkg/Cast.Cli.${{ steps.version.outputs.version }}.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Tagging is best-effort: a permissions hiccup must never mark an already-successful
      # publish as failed. If the push is rejected, emit a warning with the fix instead.
      - name: Create and push git tag
        env:
          GIT_TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$GIT_TAG" >/dev/null; then
            echo "Tag $GIT_TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$GIT_TAG" -m "Release ${{ steps.version.outputs.version }}"
          if ! git push origin "$GIT_TAG"; then
            echo "::warning::Published ${{ steps.version.outputs.version }} but could not push tag $GIT_TAG. Enable Settings > Actions > General > Workflow permissions > 'Read and write permissions' to allow tagging."
          fi
